<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>输入访问密码</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/root.css">
  <link rel="stylesheet" href="./assets/window.css">
  <link rel="stylesheet" href="./assets/form.css">
  <link rel="stylesheet" href="./assets/style.css">
  <style>
    body {
      min-height: 100vh;
      background: var(--color-page);
      overflow: hidden;
    }

    .login-titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 38px;
      background: var(--color-page);
      -webkit-app-region: drag;
    }

    .login-window-actions {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .login-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 54px 34px 28px;
    }

    .login-box {
      width: 100%;
      max-width: 300px;
    }

    .login-title {
      margin: 0 0 28px;
      color: var(--color-black);
      font-size: 24px;
      font-weight: 900;
      line-height: 1.3;
      text-align: center;
    }

    .login-field {
      display: grid;
      gap: 10px;
    }

    .login-label {
      color: var(--color-gray-700);
      font-size: 14px;
      font-weight: 800;
    }

    .login-error {
      min-height: 20px;
      margin: 8px 0 14px;
      color: var(--color-danger);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }

    .login-submit {
      width: 100%;
    }
  </style>
</head>
<body>
  <header class="login-titlebar">
    <div class="login-window-actions">
      <button class="window-action-button" id="loginMinimizeButton" type="button" aria-label="最小化"><i class="fa-solid fa-minus"></i></button>
      <button class="window-action-button is-close" id="loginCloseButton" type="button" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </header>

  <main class="login-panel">
    <section class="login-box">
      <h1 class="login-title">LensPro库管系统</h1>
      <div class="login-field">
        <label class="login-label" for="loginPasswordInput">访问密码</label>
        <input class="text-input" id="loginPasswordInput" type="password" autocomplete="current-password" placeholder="请输入访问密码">
      </div>
      <p class="login-error" id="loginErrorText"></p>
      <button class="common-button login-submit" id="loginSubmitButton" type="button">登录</button>
    </section>
  </main>

  <script>
    const loginPasswordInput = document.getElementById("loginPasswordInput");
    const loginErrorText = document.getElementById("loginErrorText");
    const loginSubmitButton = document.getElementById("loginSubmitButton");

    document.getElementById("loginMinimizeButton").addEventListener("click", function () {
      window.warehouseWindow.minimize();
    });

    document.getElementById("loginCloseButton").addEventListener("click", function () {
      window.warehouseWindow.close();
    });

    async function submitLogin() {
      loginErrorText.textContent = "";
      const password = loginPasswordInput.value.trim();
      const result = await window.warehouseAuth.login(password);
      if (!result.ok) {
        loginErrorText.textContent = result.message || "登录失败";
        loginPasswordInput.focus();
      }
    }

    loginSubmitButton.addEventListener("click", submitLogin);
    loginPasswordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        submitLogin();
      }
    });
    loginPasswordInput.focus();
  </script>
</body>
</html>
